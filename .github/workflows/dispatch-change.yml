name: Dispatch change

on:
  push:
    branches:
      - main

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.DAAP_EXTENSION_REPOS_TOKEN }} 
      - name:  'Automated Version Bump'
        uses:  'phips28/gh-action-bump-version@master'
        with:
          version-type:  'patch'
          
      - name: Trigger Repo daap-server build and deploy
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.DISPATCHER_TOKEN }}" \
          https://api.github.com/repos/forcerefresh/daap-server/dispatches \
          -d '{"event_type": "daap-master-branch-change", "client_payload": {"message": "Branch main is updated."}}'