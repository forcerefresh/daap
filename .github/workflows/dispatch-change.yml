name: Dispatch change on main branch

on:
  push:
    branches:
      - main

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Repo daap-server build and deploy
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.DISPATCHER_TOKEN }}" \
          https://api.github.com/repos/forcerefresh/daap-server/dispatches \
          -d '{"event_type": "daap-master-branch-change", "client_payload": {"message": "Branch main is updated."}}'