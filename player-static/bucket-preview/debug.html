<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Preview with Debug</title>
    <script>
      if (!window.WebSlider_GlobalScope) {
        window.WebSlider_GlobalScope = {};
      }
      // Logger
      // All = 0, Trace = 10, Debug = 20, Info = 30, Notice = 40, Warn = 50, Error = 60, Fatal = 70, None = 100
      // For Production we are using only Error and Fatal
      window.WebSlider_GlobalScope.loggerLevel = {
        player: 0,
        object: 0,
        animation: 0,
        sdk: 0,
      };
    </script>
    <script src="./wsplayer/wsplayer.js"></script>
  </head>
  <body style="margin: 0px">
    <div style="overflow: visible" id="player"></div>
    <script>
      window.addEventListener("load", async function () {
        const data = await fetch("./slider.json").then((data) => data.json());
        const player = new window.WebSliderPlayer(
          data,
          document.getElementById("player")
        );
        player.setDebug({ showBoundaries: true });
        player.play();
      });
    </script>
  </body>
</html>
