<!--index.html-->
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <script>
      if (!window.WebSlider_GlobalScope) {
        window.WebSlider_GlobalScope = {};
      }
      // Logger
      // All = 0, Trace = 10, Debug = 20, Info = 30, Notice = 40, Warn = 50, Error = 60, Fatal = 70, None = 100
      // For Production we are using only Error and Fatal
      window.WebSlider_GlobalScope.loggerLevel = {
        app: %REACT_APP_LOGGER_LEVEL_APP%,
        player: %REACT_APP_LOGGER_LEVEL_PLAYER%,
        object: %REACT_APP_LOGGER_LEVEL_OBJECT%,
        animation: %REACT_APP_LOGGER_LEVEL_ANIMATION%,
        sdk: %REACT_APP_LOGGER_LEVEL_SDK%,
        electron: %REACT_APP_LOGGER_LEVEL_ELECTRON%,
      };
    </script>
    <title>Web Slider</title>
  </head>
  <body>
    <script src="./renderer.js"></script>
  </body>
</html>
